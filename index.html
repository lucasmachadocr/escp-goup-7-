<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo 7 · Trabalhos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="shell">
    <main class="main">
      <header class="topbar">
        <button class="wordmark" data-view="inicio">GRUPO 7<span> / ESCP</span></button>
        <nav aria-label="Menu principal">
          <button class="nav active" data-view="inicio"><span>Início</span></button>
          <button class="nav" data-view="agenda"><span>Agenda</span></button>
          <button class="nav" data-view="documentos"><span>Arquivos</span></button>
          <button class="nav" data-view="equipe"><span>Equipe</span></button>
          <button class="nav" data-view="notificacoes"><span>Avisos</span></button>
          <button class="nav ai-link" data-view="agente"><span>✦ AI</span></button>
        </nav>
        <div class="top-actions"><span id="today"></span><button id="export" class="button subtle" title="Exportar dados">↓</button><label class="button subtle import-label" title="Importar dados">↑<input id="import" type="file" accept="application/json"></label></div>
      </header>
      <div class="preview-status">Prévia · alterações salvas apenas neste navegador</div>
      <h1 id="page-title" class="sr-only">Visão geral</h1>
      <div id="notice" class="notice" role="status"></div>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="entry-dialog">
    <form id="entry-form" method="dialog">
      <header><h2 id="dialog-title"></h2><button type="button" class="close" id="close-dialog" aria-label="Fechar">×</button></header>
      <div id="form-fields"></div>
      <footer><button type="button" class="button subtle" id="cancel-dialog">Cancelar</button><button class="button primary" type="submit">Salvar</button></footer>
    </form>
  </dialog>
  <script src="app.js" defer></script>
</body>
</html>
